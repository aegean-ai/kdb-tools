[project]
name = "kdb-tools"
version = "0.2.0"
description = "Store and check a kDB: OKF v0.2 bundles, grounding against PDFs, highlights, snapshot diffs and layered ontologies, with project profiles"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6",
    "pdfplumber>=0.11",
    "pypdf>=5",
    "pillow>=13",  # security floor: every Pillow below 13.0.0 has open advisories (GHSA-v9pv-5gc8-w2m6 and others)
]

[project.scripts]
okf-validate = "kdb_tools.validate:main"
okf-ground = "kdb_tools.ground:main"
okf-diff = "kdb_tools.diff:main"
okf-seed = "kdb_tools.seed:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=4",
    "pypdf>=5",
    "pillow>=13",  # security floor: every Pillow below 13.0.0 has open advisories (GHSA-v9pv-5gc8-w2m6 and others)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdb_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
